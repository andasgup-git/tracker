  .add-btn:hover { background:#F7C35F; }
  .done-btn { display:inline-block; background:#1D3A2C; color:#6FE3A1; font-weight:700; font-size:12px;
    text-decoration:none; padding:4px 12px; border-radius:8px; border:1px solid #2E5C43; }
  .done-btn:hover { background:#2E5C43; }
  .hint { font-size:11px; color:var(--muted); margin-top:6px; max-width:320px; }
  .stats { display:flex; gap:10px; flex-wrap:wrap; }
  .stat { background:var(--card); border:1px solid #2A3A5C; border-radius:10px; padding:6px 12px; font-size:12px; }
  .stat b { font-size:16px; display:block; }
  .board { display:grid; grid-template-columns:repeat(auto-fill,minmax(300px,1fr)); gap:14px; padding:14px 20px 40px; align-items:start; }
  .col { background:var(--card); border-radius:14px; border:1px solid #2A3A5C; overflow:hidden; }
  .col-h { padding:12px 14px; display:flex; align-items:center; gap:8px; font-weight:700; font-size:14px; }
  .col-h .count { margin-left:auto; background:#2A3A5C; border-radius:20px; padding:2px 10px; font-size:11px; color:var(--muted); }
  .col-body { padding:8px 10px 12px; display:flex; flex-direction:column; gap:8px; }
  .task { background:var(--card2); border-radius:10px; padding:10px 12px; border-left:4px solid #555; }
  .task .title { font-size:13px; font-weight:600; line-height:1.35; }
  .task .meta { display:flex; align-items:center; gap:8px; margin-top:7px; flex-wrap:wrap; }
  .tag { font-size:10px; font-weight:700; padding:2px 8px; border-radius:20px; text-transform:uppercase; letter-spacing:0.4px; }
  .p-high { background:#5C1F2B; color:#FF8A9A; }
  .p-medium { background:#4A3B14; color:#F5C344; }
  .p-low { background:#1D3A2C; color:#6FE3A1; }
  .due { font-size:10.5px; color:var(--muted); }
  .due.over { color:#FF8A9A; font-weight:700; }
  .notes { font-size:11px; color:var(--muted); margin-top:6px; line-height:1.4; }
  .s-done { opacity:0.5; }
  .s-done .title { text-decoration:line-through; }
  footer { padding:10px 20px 30px; color:var(--muted); font-size:11px; text-align:center; }
</style>

const STATUS_LABEL = {pending:"Pending", in_progress:"In progress", done:"Done", cancelled:"Cancelled"};

function dueClass(due) {
  if (!due) return "";
  const d = new Date(due + "T00:00:00");
  const today = new Date(); today.setHours(0,0,0,0);
  return d < today ? "over" : "";
}
function fmtDue(due) {
  if (!due) return "";
  const d = new Date(due + "T00:00:00");
  return d.toLocaleDateString(undefined, {month:"short", day:"numeric"});
}

function render() {
  const byTrack = {};
  DATA.tracks.forEach(t => byTrack[t.id] = []);
  DATA.tasks.forEach(t => { (byTrack[t.track] = byTrack[t.track] || []).push(t); });

  let total = DATA.tasks.length, done = DATA.tasks.filter(t=>t.status==="done").length;
  const high = DATA.tasks.filter(t=>t.status!=="done" && t.priority==="high").length;
  document.getElementById("sub").textContent = "Updated " + new Date().toLocaleString();
  document.getElementById("stats").innerHTML =
    `<div class="stat"><b>${total}</b>Tasks</div>` +
    `<div class="stat"><b>${total-done}</b>Open</div>` +
    `<div class="stat"><b>${high}</b>High priority</div>`;

  const board = document.getElementById("board");
  board.innerHTML = "";
  DATA.tracks.forEach(tr => {
    const tasks = byTrack[tr.id] || [];
    const open = tasks.filter(t=>t.status!=="done").length;
    const col = document.createElement("div"); col.className = "col";
    col.innerHTML = `<div class="col-h" style="border-top:3px solid ${tr.color}">
        <span>${tr.emoji}</span> ${tr.name}
        <span class="count">${open} open</span></div>`;
    const body = document.createElement("div"); body.className = "col-body";
    tasks.sort((a,b)=> (a.priority==="high"?0:1)-(b.priority==="high"?0:1));
    tasks.forEach(t => {
      const el = document.createElement("div");
      el.className = "task s-" + t.status;
      const doneBtn = t.status === "pending" || t.status === "in_progress"
        ? `<a class="done-btn" href="https://github.com/andasgup-git/tracker/issues/new?title=resolve%20${encodeURIComponent(t.id)}%20${encodeURIComponent(t.title)}&body=Mark%20as%20done%20via%20mobile.">✅ Done</a>`
        : "";
      el.innerHTML = `
        <div class="title">${t.title}</div>
        <div class="meta">
          <span class="tag p-${t.priority}">${t.priority}</span>
          <span class="tag" style="background:#2A3A5C;color:var(--muted)">${STATUS_LABEL[t.status]||t.status}</span>
          ${t.due?`<span class="due ${dueClass(t.due)}">📅 ${fmtDue(t.due)}</span>`:""}
          ${doneBtn}
        </div>
        ${t.notes?`<div class="notes">${t.notes}</div>`:""}`;
      body.appendChild(el);
    });
    col.appendChild(body);
    board.appendChild(col);
  });
}
render();
